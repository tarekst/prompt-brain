schema_version: "1.1"
name: 06-bare-invocation-no-argument
description: Invoked with no argument at all, the skill must ask for a prompt and must not invent one to optimize.
tags: [optimize, degenerate, parsing, no-argument]
execution:
  prompt: |-
    /prompt-brain:optimize-prompt
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-invoked
    type: tool_used
    tool: Skill
    min: 1
    arm: with-only
  - name: no-optimizer-output-headings
    type: regex
    target: last_message
    pattern: '^#{1,4} *(?:\d+\.\s*)?(?:the )?(?:optimized prompt|changelog|what was improved)\b'
    flags: 'im'
    match: not_contains
  - name: no-examples-file-read
    type: tool_used
    tool: Read
    input_match: examples.md
    max: 0
  - name: asks-user-for-the-prompt
    type: llm
    focus: last_message
    criteria: |-
      Does the response ask the user to supply the prompt they want optimized, and stop there?
  - name: no-invented-prompt
    type: llm
    focus: last_message
    criteria: |-
      Does the response avoid running the optimizer on a prompt the user never gave? Answer no
      if it produces an optimized prompt or a changelog for an invented, guessed, or assumed
      input. A bare usage/syntax example showing HOW to pass a prompt (including one inside a
      code fence) is fine and must not count against this — what must not appear is an
      optimized prompt or a changelog.
expected_outcome: |-
  - SKILL.md specifies this branch explicitly ("If no prompt was provided, ask the user to
    provide the prompt they want optimized") and no prose scenario covered it.
  - Asks the user for the prompt to optimize and stops.
  - Emits NO optimized prompt and NO changelog -- nothing is invented to fill the gap.
  - A code fence on its own is NOT a failure here: a correct "please supply a prompt" reply may
    legitimately show a fenced usage example. The assertion is on the optimizer's output
    headings (`Optimized Prompt`, `What was improved`, `Changelog`), which must not appear.
  - Does not read examples.md or run any part of the 5-step algorithm on a made-up input.
